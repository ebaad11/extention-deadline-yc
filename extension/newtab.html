<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab · Countdown</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <main>
      <img id="logo" class="logo" src="icons/logo.svg" alt="" />

      <div class="counter">
        <span id="days-int" class="int">--</span>
        <span class="side">
          <span id="days-frac" class="frac">.0000000</span>
          <span class="unit">days</span>
        </span>
      </div>

      <p id="label" class="label"></p>
      <p id="clock" class="clock"></p>
      <p id="when" class="when"></p>
    </main>

    <nav id="dots" class="dots" aria-label="Wallpapers"></nav>
    <p id="toast" class="toast" aria-live="polite"></p>

    <button id="open-settings" class="btn icon-btn settings-btn" type="button" title="Customize">
      <svg viewBox="0 0 8 8" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="currentColor" d="M3 0h1v1h-1zM4 0h1v1h-1zM1 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM6 1h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM7 3h1v1h-1zM0 4h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM5 4h1v1h-1zM6 4h1v1h-1zM7 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM5 5h1v1h-1zM1 6h1v1h-1zM3 6h1v1h-1zM4 6h1v1h-1zM6 6h1v1h-1zM3 7h1v1h-1zM4 7h1v1h-1z" />
      </svg>
    </button>

    <section class="music" aria-label="Music">
      <p id="station" class="station"></p>
      <div class="music-row">
        <button id="music" class="btn" type="button" aria-pressed="false">&#9835; LOFI: OFF</button>
        <button id="next-station" class="btn icon-btn" type="button" title="Next station">&#9654;&#9654;</button>
        <input id="volume" class="volume" type="range" min="0" max="1" step="0.05" title="Volume" />
      </div>
    </section>

    <dialog id="settings" class="panel">
      <form method="dialog" id="settings-form">
        <h2>CUSTOMIZE</h2>

        <label class="field">
          <span>Logo</span>
          <span class="logo-row">
            <img id="logo-preview" alt="" />
            <input id="logo-file" type="file" accept="image/*" hidden />
            <button type="button" class="btn small" id="logo-upload">UPLOAD</button>
            <button type="button" class="btn small ghost" id="logo-reset">RESET</button>
          </span>
        </label>

        <label class="field">
          <span>Count down to</span>
          <select id="f-preset"></select>
        </label>

        <label class="field">
          <span>Title</span>
          <input id="f-title" type="text" maxlength="80" />
        </label>

        <label class="field">
          <span>Deadline (your local time)</span>
          <input id="f-deadline" type="datetime-local" required />
        </label>

        <label class="field">
          <span>Wallpaper</span>
          <select id="f-scene"></select>
        </label>

        <div class="actions">
          <button type="button" class="btn small ghost" id="reset-all">RESET ALL</button>
          <span></span>
          <button type="button" class="btn small ghost" id="cancel">CANCEL</button>
          <button type="submit" class="btn small" id="save">SAVE</button>
        </div>
      </form>
    </dialog>

    <script src="config.js"></script>
    <script src="lofi.js"></script>
    <script src="player.js"></script>
    <script src="scenes/pixel.js"></script>
    <script src="scenes/engine.js"></script>
    <script src="scenes/day.js"></script>
    <script src="scenes/sunset.js"></script>
    <script src="scenes/city.js"></script>
    <script src="scenes/rain.js"></script>
    <script src="scenes/aurora.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
