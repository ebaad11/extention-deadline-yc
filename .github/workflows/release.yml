# Push a tag like v2.0.0 to publish a GitHub Release with the zip attached.
# The README links to releases/latest/download/lofi-deadline-countdown.zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/lofi-deadline-countdown.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
